name: Profile

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose - GitHub's scheduler is busiest
    # exactly on the hour and drops or delays runs queued there.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  stats:
    name: Refresh Hugging Face stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch Hugging Face stats
        env:
          # Optional. Only raises the rate limit; all data read is public.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/fetch_hf_stats.py

      - name: Rebuild header and README
        run: |
          python3 scripts/make_header.py
          python3 scripts/render_readme.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change in the numbers today - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/header.svg metrics/hf.json
          git commit -m "chore: refresh Hugging Face stats"
          git push

  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
